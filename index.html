<!doctype html>
<html>
  <head>
    <script>
      window.addEventListener("unhandledrejection", (e) => {
        const obj = e.reason;
        let msg = "UNHANDLED REJECTION: " + e.reason;
        try {
          msg += " JSON: " + JSON.stringify(obj);
        } catch(err) { msg += " KEYS: " + Object.keys(obj).join(","); }
        console.error(msg);
      });
    </script>
